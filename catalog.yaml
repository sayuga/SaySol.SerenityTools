schema_version: "1.0"

toolset:
  id: "saysol.serenitytools"
  display_name: "SaySol SerenityTools"
  catalog_version: "0.2.0"
  minimum_importer_version: "0.1.0"

defaults:
  lockfile: ".saysol/saysol.lock.yaml"
  receipt_directory: ".saysol/installed"
  transaction_directory: ".saysol/transactions"
  ownership_marker: "saysol-managed"

compatibility_lanes:
  net10:
    serenity: ">=10.5.0 <11.0.0"
    dotnet: "10.0"
    adapter: "Serenity10"

capsules:
  - id: "saysol.serenity.spreadsheet-import"
    display_name: "Spreadsheet Import"
    version: "0.2.0"
    maturity: "implemented"
    delivery: "combined"
    manifest: "src/Tools/SpreadsheetImport/capsule.yaml"
    documentation: "src/Tools/SpreadsheetImport/README.md"
    summary: "Upload, preview, map, validate, and commit spreadsheet data."

  - id: "saysol.serenity.grid-export"
    display_name: "Grid Export"
    version: null
    maturity: "recipe"
    delivery: "recipe"
    manifest: null
    documentation: "docs/recipes/exporting/excel-export.md"
    summary: "Use Serenity's native Excel export path from a grid."

  - id: "saysol.serenity.theme-kits"
    display_name: "Theme Kits"
    version: "0.2.0"
    maturity: "implemented"
    delivery: "npm"
    manifest: "src/Tools/ThemeKits/capsule.yaml"
    documentation: "src/Tools/ThemeKits/README.md"
    summary: "Composable Light, Dark, Logistics, and Future design-token themes."

  - id: "saysol.serenity.widget-library"
    display_name: "Widget Library"
    version: "0.3.0"
    maturity: "implemented"
    delivery: "npm"
    manifest: "src/Tools/WidgetLibrary/capsule.yaml"
    documentation: "src/Tools/WidgetLibrary/README.md"
    summary: "Mapped Serenity-native UI, safe SaySol builders, and optional external widget providers."

  - id: "saysol.serenity.admin-configuration"
    display_name: "Admin Configuration"
    version: "0.2.0"
    maturity: "implemented"
    delivery: "combined"
    manifest: "src/Tools/AdminConfiguration/capsule.yaml"
    documentation: "src/Tools/AdminConfiguration/README.md"
    summary: "Admin-only landing page contracts for safe application configuration."

shared_components: []
