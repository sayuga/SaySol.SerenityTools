name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement tools/requirements.txt
      - run: python tools/validate_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  capsule-dotnet:
    runs-on: ubuntu-latest
    name: Capsule .NET proofs (Serenity 10.5+ baseline)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: >-
          dotnet run
          --project tests/SpreadsheetImport.CoreProof/SpreadsheetImport.CoreProof.csproj
          -p:SaySolTargetFramework=net10.0
          --configuration Release
      - run: >-
          dotnet run
          --project tests/AdminConfiguration.CoreProof/AdminConfiguration.CoreProof.csproj
          -p:SaySolTargetFramework=net10.0
          --configuration Release

  capsule-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Type-check capsule packages
        shell: bash
        run: |
          for package in \
            src/Tools/SpreadsheetImport/ts \
            src/Tools/ThemeKits/ts \
            src/Tools/WidgetLibrary/ts \
            src/Tools/AdminConfiguration/ts
          do
            npm ci --ignore-scripts --prefix "$package"
            npm run typecheck --prefix "$package"
          done

  sandbox-candidate:
    name: Disposable sandbox candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sandbox/host/package-lock.json
      - name: Instantiate clean control host
        run: ./sandbox/scripts/instantiate.sh "$RUNNER_TEMP/saysol-sandbox"
      - name: Validate clean control host
        run: "$RUNNER_TEMP/saysol-sandbox/sandboxctl" validate
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-candidate-evidence
          path: ${{ runner.temp }}/saysol-sandbox/evidence/

  publish-wiki:
    name: Publish GitHub Wiki
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repository-contracts
      - capsule-dotnet
      - capsule-typescript
      - sandbox-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize validated wiki source
        shell: bash
        env:
          WIKI_PUBLISH_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WIKI_PUBLISH_TOKEN}" ]]; then
            echo "WIKI_PUBLISH_TOKEN is not configured." >&2
            exit 1
          fi

          wiki_checkout="${RUNNER_TEMP}/SaySol.SerenityTools.wiki"
          git clone \
            "https://x-access-token:${WIKI_PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "${wiki_checkout}"

          rsync -a --delete --exclude='.git/' wiki/ "${wiki_checkout}/"

          git -C "${wiki_checkout}" config user.name "github-actions[bot]"
          git -C "${wiki_checkout}" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${wiki_checkout}" add --all

          if git -C "${wiki_checkout}" diff --cached --quiet; then
            echo "GitHub Wiki is already synchronized."
            exit 0
          fi

          git -C "${wiki_checkout}" commit \
            -m "Sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git -C "${wiki_checkout}" push origin HEAD:master
