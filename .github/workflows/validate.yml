name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement tools/requirements.txt
      - run: python tools/validate_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  spreadsheet-import-dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: net8
            dotnet: "8.0.x"
            framework: net8.0
          - lane: net10
            dotnet: "10.0.x"
            framework: net10.0
    name: Spreadsheet Import (${{ matrix.lane }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: >-
          dotnet run
          --project tests/SpreadsheetImport.CoreProof/SpreadsheetImport.CoreProof.csproj
          -p:SaySolTargetFramework=${{ matrix.framework }}
          --configuration Release

  spreadsheet-import-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Tools/SpreadsheetImport/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npm run typecheck
